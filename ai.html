<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Groq Chat</title>
    <style>
        :root {
            --bg-primary: #0b0b10;
            --bg-secondary: #15151e;
            --bg-tertiary: #1c1c28;
            --bg-sidebar: rgba(11, 11, 16, 0.92);
            --text-primary: #eaeaef;
            --text-secondary: #aaaab8;
            --text-tertiary: #6e6e7c;
            --accent: #f55036;
            --accent-hover: #ff6b52;
            --accent-light: rgba(245, 80, 54, 0.12);
            --accent-glow: rgba(245, 80, 54, 0.25);
            --border: rgba(255, 255, 255, 0.07);
            --border-light: rgba(255, 255, 255, 0.04);
            --glass-bg: rgba(21, 21, 30, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
            --user-bubble: #1e1e2c;
            --user-bubble-border: rgba(245, 80, 54, 0.3);
            --ai-bubble: rgba(17, 17, 26, 0.85);
            --ai-bubble-border: rgba(255, 255, 255, 0.05);
            --danger: #e0556a;
            --danger-hover: #f06b7e;
            --success: #4ade80;
            --warning: #f59e0b;
            --radius-xs: 6px;
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            --font-mono: 'SF Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --sidebar-width: 280px;
            --topbar-height: 48px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }
        .light-mode {
            --bg-primary: #f2f2f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #eaeaef;
            --bg-sidebar: rgba(242, 242, 245, 0.9);
            --text-primary: #1a1a22;
            --text-secondary: #55555e;
            --text-tertiary: #888890;
            --border: rgba(0, 0, 0, 0.07);
            --border-light: rgba(0, 0, 0, 0.03);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.08);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --user-bubble: #eef0f5;
            --user-bubble-border: rgba(245, 80, 54, 0.2);
            --ai-bubble: rgba(255, 255, 255, 0.9);
            --ai-bubble-border: rgba(0, 0, 0, 0.05);
            --accent-light: rgba(245, 80, 54, 0.08);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        html,
        body {
            height: 100%;
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%;
        }
        body {
            display: flex;
            position: relative;
            padding-top: var(--safe-top);
        }
        input,
        textarea,
        select {
            -webkit-user-select: text;
            user-select: text;
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 90;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            height: 100%;
            height: -webkit-fill-available;
            background: var(--bg-sidebar);
            -webkit-backdrop-filter: blur(28px);
            backdrop-filter: blur(28px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            min-height: var(--topbar-height);
            padding-top: calc(12px + var(--safe-top));
        }
        .sidebar-logo {
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, #f55036, #ff8a6f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.8rem;
            font-family: var(--font-sans);
            transition: all var(--transition);
            white-space: nowrap;
            outline: none;
            text-decoration: none;
            font-weight: 500;
            min-height: 36px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.96);
            transition: transform 0.08s;
        }
        .btn-accent {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 2px 12px var(--accent-glow);
        }
        .btn-accent:active {
            background: #e04830;
            box-shadow: 0 1px 6px var(--accent-glow);
        }
        .btn-ghost {
            background: transparent;
            border-color: transparent;
        }
        .btn-ghost:active {
            background: var(--bg-tertiary);
        }
        .btn-sm {
            padding: 5px 9px;
            font-size: 0.7rem;
            border-radius: 6px;
            min-height: 28px;
        }
        .btn-icon {
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 50%;
            flex-shrink: 0;
            min-height: unset;
        }
        .btn-danger {
            background: transparent;
            border-color: transparent;
            color: var(--danger);
        }
        .btn-danger:active {
            background: rgba(224, 85, 106, 0.12);
        }
        .sidebar-new-chat {
            margin: 10px 12px;
            flex-shrink: 0;
        }
        .sidebar-new-chat .btn {
            width: 100%;
            justify-content: flex-start;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-weight: 600;
            gap: 8px;
        }
        .conversation-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 4px 8px;
            display: flex;
            flex-direction: column;
            gap: 1px;
            -webkit-overflow-scrolling: touch;
        }
        .conversation-list::-webkit-scrollbar {
            width: 3px;
        }
        .conversation-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        .conv-item {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 9px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            border: 1px solid transparent;
            position: relative;
            min-height: 38px;
        }
        .conv-item:active {
            background: var(--bg-tertiary);
            transform: scale(0.98);
        }
        .conv-item.active {
            background: var(--accent-light);
            border-color: rgba(245, 80, 54, 0.25);
        }
        .conv-item-title {
            flex: 1;
            font-size: 0.78rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-secondary);
            min-width: 0;
            pointer-events: none;
        }
        .conv-item.active .conv-item-title {
            color: var(--text-primary);
            font-weight: 500;
        }
        .conv-item-actions {
            display: flex;
            gap: 1px;
            opacity: 0;
            transition: opacity var(--transition);
            flex-shrink: 0;
        }
        .conv-item:active .conv-item-actions,
        .conv-item:hover .conv-item-actions {
            opacity: 1;
        }
        .conv-item-actions .btn-icon {
            width: 24px;
            height: 24px;
            font-size: 0.65rem;
        }
        .sidebar-footer {
            padding: 8px 10px;
            border-top: 1px solid var(--border-light);
            flex-shrink: 0;
            display: flex;
            gap: 4px;
            padding-bottom: calc(8px + var(--safe-bottom));
        }
        .sidebar-footer .btn {
            flex: 1;
            justify-content: center;
            font-size: 0.72rem;
            padding: 7px 8px;
            min-height: 32px;
        }
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            height: -webkit-fill-available;
            min-width: 0;
            position: relative;
        }
        .topbar {
            height: var(--topbar-height);
            min-height: var(--topbar-height);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 8px;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-sidebar);
            -webkit-backdrop-filter: blur(24px);
            backdrop-filter: blur(24px);
            z-index: 50;
            flex-shrink: 0;
            padding-top: var(--safe-top);
        }
        .hamburger {
            display: none;
            width: 34px;
            height: 34px;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            flex-shrink: 0;
            transition: background var(--transition);
        }
        .hamburger:active {
            background: var(--bg-tertiary);
        }
        .hamburger svg {
            width: 18px;
            height: 18px;
        }
        .topbar-title {
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        .topbar-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .topbar-actions .btn {
            font-size: 0.7rem;
            padding: 6px 9px;
            min-height: 30px;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 10px 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        .chat-container::-webkit-scrollbar {
            width: 3px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 8px;
            padding: 30px 16px;
            opacity: 0.75;
        }
        .welcome-screen .logo-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f55036, #d1402a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #fff;
            margin-bottom: 4px;
            box-shadow: 0 6px 24px rgba(245, 80, 54, 0.3);
        }
        .welcome-screen h2 {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .welcome-screen p {
            color: var(--text-secondary);
            font-size: 0.8rem;
            max-width: 300px;
            line-height: 1.4;
        }
        .message-row {
            display: flex;
            gap: 7px;
            padding: 4px 4px;
            animation: fadeInUp 0.25s ease-out;
            position: relative;
            max-width: 100%;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-top: 2px;
        }
        .avatar-user {
            background: linear-gradient(135deg, #f55036, #c9402a);
            color: #fff;
        }
        .avatar-ai {
            background: linear-gradient(135deg, #1e1e2c, #181820);
            color: #ff8a6f;
            border: 1.5px solid rgba(245, 80, 54, 0.35);
        }
        .light-mode .avatar-ai {
            background: linear-gradient(135deg, #fdf0ed, #fce8e3);
            color: #d1402a;
            border-color: rgba(245, 80, 54, 0.25);
        }
        .message-bubble-wrap {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .message-bubble {
            padding: 10px 12px;
            border-radius: var(--radius);
            line-height: 1.5;
            font-size: 0.84rem;
            word-wrap: break-word;
            overflow-wrap: break-word;
            position: relative;
            transition: border-color var(--transition);
        }
        .message-user .message-bubble {
            background: var(--user-bubble);
            border: 1px solid var(--user-bubble-border);
            border-bottom-right-radius: 5px;
        }
        .message-ai .message-bubble {
            background: var(--ai-bubble);
            border: 1px solid var(--ai-bubble-border);
            border-bottom-left-radius: 5px;
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
        }
        .message-bubble p {
            margin: 0 0 6px 0;
        }
        .message-bubble p:last-child {
            margin-bottom: 0;
        }
        .message-bubble code {
            background: rgba(245, 80, 54, 0.12);
            padding: 2px 5px;
            border-radius: 3px;
            font-family: var(--font-mono);
            font-size: 0.78em;
            color: #ff8a6f;
        }
        .light-mode .message-bubble code {
            background: rgba(245, 80, 54, 0.08);
            color: #c9402a;
        }
        .message-bubble pre {
            background: #0a0a12;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            line-height: 1.45;
            margin: 8px 0;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .light-mode .message-bubble pre {
            background: #f0f0f3;
            border-color: rgba(0, 0, 0, 0.08);
        }
        .message-bubble pre code {
            background: transparent;
            padding: 0;
            font-size: inherit;
            color: inherit;
            border-radius: 0;
        }
        .code-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-xs) var(--radius-xs) 0 0;
            font-size: 0.65rem;
            color: var(--text-tertiary);
            font-family: var(--font-sans);
            border: 1px solid var(--border);
            border-bottom: none;
        }
        .light-mode .code-block-header {
            background: rgba(0, 0, 0, 0.02);
        }
        .code-block-header+.message-bubble pre,
        pre.has-header {
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            margin-top: 0;
        }
        .copy-btn {
            font-size: 0.65rem;
            padding: 3px 7px;
            cursor: pointer;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-secondary);
            transition: all var(--transition);
            font-family: var(--font-sans);
            white-space: nowrap;
        }
        .copy-btn:active {
            background: var(--success);
            color: #000;
            border-color: var(--success);
        }
        .copy-btn.copied {
            background: var(--success);
            color: #000;
            border-color: var(--success);
        }
        .message-bubble table {
            border-collapse: collapse;
            width: 100%;
            margin: 8px 0;
            font-size: 0.75rem;
            border-radius: var(--radius-xs);
            overflow: hidden;
            display: block;
            overflow-x: auto;
        }
        .message-bubble th,
        .message-bubble td {
            border: 1px solid var(--border);
            padding: 6px 9px;
            text-align: left;
            white-space: nowrap;
        }
        .message-bubble th {
            background: var(--bg-tertiary);
            font-weight: 600;
        }
        .message-bubble blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 10px;
            margin: 6px 0;
            color: var(--text-secondary);
            font-style: italic;
        }
        .message-bubble ul,
        .message-bubble ol {
            margin: 5px 0;
            padding-left: 18px;
        }
        .message-bubble li {
            margin: 1px 0;
        }
        .message-bubble h1,
        .message-bubble h2,
        .message-bubble h3 {
            margin: 10px 0 4px;
            font-weight: 600;
            line-height: 1.3;
        }
        .message-bubble h1 {
            font-size: 1.15rem;
        }
        .message-bubble h2 {
            font-size: 1.05rem;
        }
        .message-bubble h3 {
            font-size: 0.95rem;
        }
        .message-bubble hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 10px 0;
        }
        .message-bubble a {
            color: var(--accent-hover);
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .generated-image {
            display: block;
            width: 100%;
            max-width: 320px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            margin-top: 6px;
        }
        .message-actions {
            display: flex;
            gap: 3px;
            opacity: 0;
            transition: opacity var(--transition);
            flex-wrap: wrap;
            padding: 1px 0;
        }
        .message-row:active .message-actions,
        .message-row:hover .message-actions {
            opacity: 1;
        }
        .message-meta {
            font-size: 0.65rem;
            color: var(--text-tertiary);
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .input-area {
            padding: 8px 10px;
            border-top: 1px solid var(--border-light);
            background: var(--bg-sidebar);
            -webkit-backdrop-filter: blur(24px);
            backdrop-filter: blur(24px);
            flex-shrink: 0;
            z-index: 50;
            padding-bottom: calc(8px + var(--safe-bottom));
        }
        .input-row {
            display: flex;
            gap: 6px;
            align-items: flex-end;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 4px 6px 4px 14px;
            transition: all var(--transition);
            box-shadow: var(--shadow);
        }
        .input-row:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(245, 80, 54, 0.08), var(--shadow);
        }
        .input-row textarea {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.85rem;
            resize: none;
            outline: none;
            padding: 5px 0;
            max-height: 140px;
            line-height: 1.4;
            min-height: 22px;
            align-self: center;
        }
        .input-row textarea::placeholder {
            color: var(--text-tertiary);
        }
        .input-row .btn-send {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            padding: 0;
            flex-shrink: 0;
            align-self: flex-end;
            min-height: unset;
        }
        .input-row .btn-stop {
            align-self: flex-end;
            flex-shrink: 0;
            animation: pulse-stop 1.5s infinite;
            min-height: unset;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            padding: 0;
        }
        @keyframes pulse-stop {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(224, 85, 106, 0.5);
            }
            50% {
                box-shadow: 0 0 0 12px rgba(224, 85, 106, 0);
            }
        }
        .input-stats {
            display: flex;
            gap: 10px;
            font-size: 0.65rem;
            color: var(--text-tertiary);
            padding: 3px 2px 0;
            flex-wrap: wrap;
        }
        .typing-indicator {
            display: flex;
            gap: 3px;
            padding: 6px 0;
            align-items: center;
        }
        .typing-indicator span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: typingBounce 1.1s infinite;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.18s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.36s;
        }
        @keyframes typingBounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.35;
            }
            30% {
                transform: translateY(-7px);
                opacity: 1;
            }
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 200;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.2s ease-out;
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
            padding-bottom: var(--safe-bottom);
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            padding: 18px 16px;
            width: 100%;
            max-width: 560px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.5);
            animation: modalUp 0.3s ease-out;
            -webkit-overflow-scrolling: touch;
        }
        @keyframes modalUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        .modal h3 {
            font-size: 1.1rem;
            margin-bottom: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .form-group {
            margin-bottom: 11px;
        }
        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 3px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.85rem;
            outline: none;
            transition: border-color var(--transition);
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(245, 80, 54, 0.06);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 50px;
        }
        .form-group input[type="range"] {
            padding: 0;
            height: 5px;
            -webkit-appearance: none;
            background: var(--bg-tertiary);
            border-radius: 3px;
            cursor: pointer;
            border: none;
            accent-color: var(--accent);
        }
        .form-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }
        .range-value {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 6px;
            color: var(--accent);
        }
        .modal-actions {
            display: flex;
            gap: 7px;
            justify-content: flex-end;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            bottom: calc(20px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 9px 18px;
            border-radius: 20px;
            font-size: 0.78rem;
            z-index: 300;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            animation: toastIn 0.3s ease-out, toastOut 0.3s ease-out 2.2s forwards;
            pointer-events: none;
            white-space: nowrap;
            font-weight: 500;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(16px);
            }
        }
        .hidden {
            display: none !important;
        }
        @media (min-width: 769px) {
            .modal {
                border-radius: var(--radius-xl);
                margin: auto;
                max-height: 80vh;
                animation: modalIn 0.25s ease-out;
            }
            @keyframes modalIn {
                from {
                    transform: translateY(16px) scale(0.97);
                    opacity: 0;
                }
                to {
                    transform: translateY(0) scale(1);
                    opacity: 1;
                }
            }
        }
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
                z-index: 100;
                width: 270px;
                min-width: 270px;
                padding-top: var(--safe-top);
            }
            .sidebar.open {
                transform: translateX(0);
                box-shadow: 6px 0 30px rgba(0, 0, 0, 0.6);
            }
            .sidebar-overlay {
                display: block;
            }
            .hamburger {
                display: flex;
            }
            .topbar {
                padding: 0 6px;
                gap: 4px;
            }
            .chat-container {
                padding: 6px 2px;
            }
            .message-bubble {
                padding: 8px 10px;
                font-size: 0.8rem;
                border-radius: var(--radius-sm);
            }
            .message-avatar {
                width: 22px;
                height: 22px;
                font-size: 0.6rem;
                margin-top: 1px;
            }
            .message-row {
                gap: 5px;
                padding: 3px 2px;
            }
            .input-area {
                padding: 6px 6px;
                padding-bottom: calc(6px + var(--safe-bottom));
            }
            .input-row {
                border-radius: var(--radius-lg);
                padding: 3px 4px 3px 10px;
                gap: 4px;
            }
            .input-row textarea {
                font-size: 0.8rem;
                max-height: 100px;
            }
            .input-row .btn-send,
            .input-row .btn-stop {
                width: 30px;
                height: 30px;
            }
            .btn {
                font-size: 0.73rem;
                padding: 7px 10px;
                min-height: 32px;
            }
            .btn-sm {
                font-size: 0.65rem;
                padding: 4px 7px;
                min-height: 26px;
            }
            .topbar-actions .btn {
                font-size: 0.65rem;
                padding: 5px 7px;
                min-height: 28px;
            }
            .input-stats {
                font-size: 0.6rem;
                gap: 6px;
            }
            .message-actions .btn {
                font-size: 0.65rem;
                padding: 4px 7px;
                min-height: 26px;
            }
            .welcome-screen .logo-icon {
                width: 40px;
                height: 40px;
                font-size: 1.3rem;
            }
            .welcome-screen h2 {
                font-size: 1.15rem;
            }
            .welcome-screen p {
                font-size: 0.73rem;
            }
            .code-block-header {
                font-size: 0.6rem;
                padding: 4px 8px;
            }
            .copy-btn {
                font-size: 0.6rem;
                padding: 2px 6px;
            }
            .message-bubble pre {
                font-size: 0.7rem;
                padding: 8px 10px;
            }
        }
        @media (max-width: 380px) {
            .message-avatar {
                width: 20px;
                height: 20px;
                font-size: 0.55rem;
            }
            .message-bubble {
                padding: 7px 8px;
                font-size: 0.76rem;
                border-radius: var(--radius-xs);
            }
            .message-row {
                gap: 4px;
                padding: 2px 1px;
            }
            .input-row textarea {
                font-size: 0.76rem;
            }
            .btn {
                font-size: 0.7rem;
                padding: 6px 8px;
                min-height: 30px;
            }
            .topbar-title {
                font-size: 0.78rem;
            }
        }
        .drop-zone-highlight {
            outline: 2px dashed var(--accent);
            outline-offset: -4px;
            background: var(--accent-light) !important;
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo">⚡ Groq Chat</span>
        </div>
        <div class="sidebar-new-chat">
            <button class="btn btn-accent" onclick="newChat()" title="New Chat">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                New Chat
            </button>
        </div>
        <div class="conversation-list" id="conversationList"></div>
        <div class="sidebar-footer">
            <button class="btn btn-ghost btn-sm" onclick="openSettings()" title="Settings">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
            <button class="btn btn-ghost btn-sm" onclick="clearAllConversations()" title="Clear All">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
        </div>
    </aside>

    <div class="main-area" id="mainArea">
        <div class="topbar">
            <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="Menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <span class="topbar-title" id="topbarTitle">Groq Chat</span>
            <div class="topbar-actions">
                <button class="btn btn-ghost btn-sm" onclick="exportChat()" title="Export">Export</button>
                <button class="btn btn-ghost btn-sm" onclick="importChatTrigger()" title="Import">Import</button>
                <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importChat(event)">
                <button class="btn btn-ghost btn-sm" onclick="forceStop()" title="Reset AI">Reset</button>
            </div>
        </div>
        <div class="chat-container" id="chatContainer">
            <div class="welcome-screen" id="welcomeScreen">
                <div class="logo-icon">⚡</div>
                <h2>Groq Chat</h2>
                <p>Fast AI responses powered by Groq. Ask me anything.</p>
            </div>
        </div>
        <div class="input-area" id="inputArea">
            <div class="input-row" id="inputRow">
                <textarea id="chatInput" rows="1" placeholder="Ask me anything..." maxlength="100000" oninput="autoResizeTextarea()"></textarea>
                <button type="button" class="btn btn-ghost" id="searchBtn" onclick="searchAndSend()" title="Search">🔎</button>
                <button type="button" class="btn btn-accent btn-send" id="sendBtn" onclick="sendMessage()" title="Send">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                </button>
                <button type="button" class="btn btn-danger btn-send hidden" id="stopBtn" onclick="stopGeneration()" title="Stop">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
                </button>
            </div>
            <div class="input-stats" id="inputStats">
                <span>Words: 0</span><span>Chars: 0</span><span>~Tokens: 0</span>
            </div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="settingsModal">
        <div class="modal">
            <h3>⚙️ Settings</h3>
            <div class="form-group">
                <label>Groq API Key</label>
                <input type="password" id="settingApiKey" placeholder="gsk_..." autocomplete="off">
            </div>
            <div class="form-group">
                <label>Model</label>
                <input type="text" id="settingModel" list="modelSuggestions" placeholder="e.g. openai/gpt-oss-120b" autocomplete="off">
                <datalist id="modelSuggestions">
                    <option value="openai/gpt-oss-120b">
                    <option value="openai/gpt-oss-20b">
                    <option value="llama-3.3-70b-versatile">
                    <option value="llama-3.1-8b-instant">
                </datalist>
            </div>
            <div class="form-group">
                <label>Temperature</label>
                <input type="range" id="settingTemperature" min="0" max="2" step="0.01" value="0.7">
                <span class="range-value" id="tempValue">0.7</span>
            </div>
            <div class="form-group">
                <label>Max Tokens</label>
                <input type="number" id="settingMaxTokens" min="1" max="32000" value="2048">
            </div>
            <div class="form-group">
                <label>Top P</label>
                <input type="range" id="settingTopP" min="0" max="1" step="0.01" value="1">
                <span class="range-value" id="topPValue">1</span>
            </div>
            <div class="form-group">
                <label>System Prompt (Optional)</label>
                <textarea id="settingSystemPrompt" placeholder="Custom system prompt..."></textarea>
            </div>
            <div class="form-group">
                <label style="display:flex;gap:6px;align-items:center;">
                    <input type="checkbox" id="settingStreaming" style="width:auto;margin:0;">
                    Enable Streaming
                </label>
            </div>
            <div class="form-group">
                <label style="display:flex;gap:6px;align-items:center;">
                    <input type="checkbox" id="settingTheme" style="width:auto;margin:0;" onchange="toggleTheme(this.checked)">
                    Light Mode
                </label>
            </div>
            <div class="modal-actions">
                <button class="btn btn-ghost btn-sm" onclick="closeSettings()">Cancel</button>
                <button class="btn btn-accent btn-sm" onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const state = {
                conversations: [],
                currentConversationId: null,
                isGenerating: false,
                abortController: null,
                generationStartTime: 0,
                tokensGenerated: 0,
                settings: {
                    apiKey: '',
                    model: 'openai/gpt-oss-120b',
                    temperature: 0.7,
                    maxTokens: 2048,
                    topP: 1,
                    systemPrompt: '',
                    streaming: true,
                    theme: 'dark'
                }
            };

            function generateId() { return Math.random().toString(36).substring(2, 11); }

            function normalizeModel(model) {
                const value = (model || '').trim();
                if (!value) return 'openai/gpt-oss-120b';
                if (value.toLowerCase().startsWith('openai/')) return value;
                if (value.toLowerCase() === 'gpt-oss-120b' || value.toLowerCase() === 'gpt-oss-20b') {
                    return `openai/${value}`;
                }
                return value;
            }

            function getErrorMessage(resp, fallbackText) {
                return resp.text ? resp.text().then(text => {
                    try {
                        const data = JSON.parse(text);
                        return data.error?.message || data.message || text || fallbackText;
                    } catch (e) {
                        return text || fallbackText;
                    }
                }) : Promise.resolve(fallbackText);
            }

            function saveState() {
                localStorage.setItem('groqChatState', JSON.stringify(state));
            }

            function loadState() {
                const s = localStorage.getItem('groqChatState');
                if (s) Object.assign(state, JSON.parse(s));
            }

            function saveConversations() { saveState(); }

            function getCurrentConversation() {
                return state.conversations.find(c => c.id === state.currentConversationId);
            }

            function ensureConversation() {
                if (!state.currentConversationId || !getCurrentConversation()) {
                    const conv = { id: generateId(), title: 'New Chat', messages: [], createdAt: Date.now(), updatedAt: Date.now() };
                    state.conversations.unshift(conv);
                    state.currentConversationId = conv.id;
                    saveConversations();
                }
                return getCurrentConversation();
            }

            function autoTitle(msgs) {
                const first = msgs.find(m => m.role === 'user')?.content || '';
                return first.substring(0, 40) + (first.length > 40 ? '...' : '');
            }

            function renderAll() {
                renderConversationList();
                updateTopbar();
                renderChat();
            }

            function renderConversationList() {
                const container = document.getElementById('conversationList');
                if (!container) return;

                if (!state.conversations.length) {
                    container.innerHTML = '<div class="empty-state">No chats yet</div>';
                    return;
                }

                container.innerHTML = '';
                state.conversations.forEach(conv => {
                    const item = document.createElement('div');
                    item.className = `conv-item${conv.id === state.currentConversationId ? ' active' : ''}`;
                    item.onclick = () => {
                        state.currentConversationId = conv.id;
                        saveConversations();
                        renderAll();
                    };
                    item.innerHTML = `
                        <div class="conv-item-title">${escapeHtml(conv.title || 'New Chat')}</div>
                        <div class="conv-item-actions">
                            <button class="btn btn-icon btn-sm" onclick="event.stopPropagation(); renamePrompt('${conv.id}')">✏️</button>
                            <button class="btn btn-icon btn-sm" onclick="event.stopPropagation(); deleteConversation('${conv.id}')">🗑</button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            }

            function updateTopbar() {
                const titleEl = document.getElementById('topbarTitle');
                const conv = getCurrentConversation();
                if (titleEl) {
                    titleEl.textContent = conv?.title || 'Groq Chat';
                }
            }

            function renderChat() {
                const container = document.getElementById('chatContainer');
                const welcome = document.getElementById('welcomeScreen');
                if (!container) return;

                const conv = getCurrentConversation();
                if (!conv || !conv.messages || !conv.messages.length) {
                    container.innerHTML = '';
                    if (welcome) {
                        welcome.classList.remove('hidden');
                        container.appendChild(welcome);
                    }
                    return;
                }

                if (welcome) {
                    welcome.classList.add('hidden');
                }
                container.innerHTML = '';

                conv.messages.forEach((m, i) => {
                    const row = document.createElement('div');
                    row.className = `message-row ${m.role === 'user' ? 'message-user' : 'message-ai'}`;
                    row.dataset.index = i;
                    const avatar = m.role === 'user' ? 'You' : 'AI';
                    const avatarClass = m.role === 'user' ? 'avatar-user' : 'avatar-ai';
                    const rendered = m.content ? renderMarkdown(m.content) : '<div class="typing-indicator"><span></span><span></span><span></span></div>';

                    row.innerHTML = `
                        <div class="message-avatar ${avatarClass}">${escapeHtml(avatar)}</div>
                        <div class="message-bubble-wrap">
                            <div class="message-bubble">${rendered}</div>
                            <div class="message-actions">
                                <button class="btn btn-ghost btn-sm" onclick="copyMessage(${i})">📋</button>
                                ${m.role === 'user' ? `<button class="btn btn-ghost btn-sm" onclick="editMessage(${i})">✏️</button>` : ''}
                                <button class="btn btn-ghost btn-sm" onclick="deleteMessage(${i})">🗑️</button>
                                ${m.role === 'assistant' ? `<button class="btn btn-ghost btn-sm" onclick="retryResponse(${i})">🔄</button>` : ''}
                            </div>
                        </div>
                    `;
                    postProcessCodeBlocks(row);
                    container.appendChild(row);
                });

                setTimeout(scrollToBottom, 0);
            }

            function newChat() {
                const conv = { id: generateId(), title: 'New Chat', messages: [], createdAt: Date.now(), updatedAt: Date.now() };
                state.conversations.unshift(conv);
                state.currentConversationId = conv.id;
                saveConversations();
                renderAll();
            }

            function deleteConversation(id) {
                if (!id) return;
                state.conversations = state.conversations.filter(c => c.id !== id);
                if (state.currentConversationId === id) {
                    state.currentConversationId = state.conversations[0]?.id || null;
                }
                saveConversations();
                renderAll();
            }

            function renamePrompt(id) {
                const conv = state.conversations.find(c => c.id === id);
                if (!conv) return;
                const newTitle = prompt('Rename chat:', conv.title || 'New Chat');
                if (newTitle && newTitle.trim()) {
                    conv.title = newTitle.trim();
                    conv.updatedAt = Date.now();
                    saveConversations();
                    renderAll();
                }
            }

            function clearAllConversations() {
                if (!confirm('Clear all conversations?')) return;
                state.conversations = [];
                state.currentConversationId = null;
                saveConversations();
                renderAll();
            }

            function postProcessCodeBlocks(row) {
                row.querySelectorAll('pre').forEach(pre => {
                    const code = pre.textContent || '';
                    const lang = pre.className.replace('language-', '');
                    const header = document.createElement('div');
                    header.className = 'code-block-header';
                    header.innerHTML = `<span>${lang || 'code'}</span><button class="copy-btn" onclick="copyCodeBlock(this)">Copy</button>`;
                    pre.parentNode.insertBefore(header, pre);
                    pre.classList.add('has-header');
                });
            }

            function copyCodeBlock(btn) {
                const pre = btn.closest('.code-block-header').nextElementSibling;
                navigator.clipboard.writeText(pre?.textContent || '').then(() => {
                    showToast('Copied!');
                }).catch(() => showToast('Copy failed.'));
            }

            function copyMessage(index) {
                const msg = getCurrentConversation()?.messages[index];
                if (msg) navigator.clipboard.writeText(msg.content).then(() => showToast('Copied!')).catch(() => showToast('Copy failed.'));
            }

            function editMessage(index) {
                if (state.isGenerating) return;
                const conv = getCurrentConversation();
                if (!conv?.messages[index] || conv.messages[index].role !== 'user') return;
                const nc = prompt('Edit:', conv.messages[index].content);
                if (nc?.trim()) {
                    conv.messages[index].content = nc.trim();
                    conv.updatedAt = Date.now();
                    saveConversations();
                    renderAll();
                }
            }

            function deleteMessage(index) {
                if (state.isGenerating) return;
                const conv = getCurrentConversation();
                if (!conv?.messages[index]) return;
                conv.messages.splice(index, 1);
                conv.updatedAt = Date.now();
                if (!conv.messages.length) conv.title = 'New Chat';
                saveConversations();
                renderAll();
            }

            function retryResponse(index) {
                if (state.isGenerating) return;
                const conv = getCurrentConversation();
                if (!conv?.messages[index] || conv.messages[index].role !== 'assistant') return;
                conv.messages.splice(index, 1);
                conv.updatedAt = Date.now();
                saveConversations();
                renderAll();
                sendMessage();
            }

            function scrollToBottom() {
                const c = document.getElementById('chatContainer');
                requestAnimationFrame(() => { c.scrollTop = c.scrollHeight; });
            }

            function updateInputStats() {
                const t = document.getElementById('chatInput').value;
                const words = t.trim().split(/\s+/).filter(w => w.length).length;
                const chars = t.length;
                const tokens = Math.ceil(chars / 4);
                document.getElementById('inputStats').innerHTML = `<span>Words: ${words}</span><span>Chars: ${chars}</span><span>~Tokens: ${tokens}</span>`;
            }

            function autoResizeTextarea() {
                const ta = document.getElementById('chatInput');
                ta.style.height = 'auto';
                ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
                updateInputStats();
            }

            function handleInputKeydown(e) {
                const isEnterKey = e.key === 'Enter' || e.keyCode === 13 || e.code === 'Enter' || e.code === 'NumpadEnter';
                if (e.isComposing || e.defaultPrevented || !isEnterKey || e.shiftKey) return;
                e.preventDefault();
                e.stopPropagation();
                sendMessage();
            }

            async function sendMessage() {
                if (state.isGenerating) return;
                const input = document.getElementById('chatInput');
                const content = input.value.trim();
                if (!content) return;
                if (content.toLowerCase().startsWith('search:')) {
                    const q = content.split(':').slice(1).join(':').trim();
                    if (!q) return;
                    showToast('Searching web...');
                    const summary = await performWebSearch(q);
                    const conv = ensureConversation();
                    conv.messages.push({ role: 'user', content, timestamp: Date.now() });
                    conv.messages.push({ role: 'assistant', content: summary, timestamp: Date.now() });
                    conv.updatedAt = Date.now();
                    saveConversations();
                    input.value = '';
                    input.style.height = 'auto';
                    updateInputStats();
                    renderAll();
                    return;
                }
                if (!state.settings.apiKey) {
                    showToast('Set API key in Settings.');
                    openSettings(); return;
                }
                const conv = ensureConversation();
                conv.messages.push({ role: 'user', content, timestamp: Date.now() });
                if (conv.title === 'New Chat') conv.title = autoTitle(conv.messages);
                conv.updatedAt = Date.now();
                saveConversations();
                input.value = '';
                input.style.height = 'auto';
                updateInputStats();
                renderAll();
                const aiIdx = conv.messages.length;
                conv.messages.push({ role: 'assistant', content: '', timestamp: Date.now() });
                saveConversations();
                renderAll();
                const aiRow = document.querySelector(`.message-row[data-index="${aiIdx}"]`);
                const aiBubble = aiRow?.querySelector('.message-bubble');
                if (aiBubble) {
                    aiRow.querySelector('.message-actions')?.remove();
                    aiBubble.innerHTML =
                        '<div class="typing-indicator"><span></span><span></span><span></span></div>';
                }
                scrollToBottom();
                state.isGenerating = true;
                state.abortController = new AbortController();
                state.generationStartTime = Date.now();
                state.tokensGenerated = 0;
                updateSendStopButtons();
                const msgs = [];
                if (state.settings.systemPrompt) msgs.push({ role: 'system', content: state.settings.systemPrompt });
                conv.messages.slice(0, -1).forEach(m => msgs.push({ role: m.role, content: m.content }));
                const body = {
                    model: normalizeModel(state.settings.model),
                    messages: msgs,
                    temperature: parseFloat(state.settings.temperature),
                    max_tokens: parseInt(state.settings.maxTokens),
                    top_p: parseFloat(state.settings.topP),
                    stream: state.settings.streaming
                };
                try {
                    const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${state.settings.apiKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body),
                        signal: state.abortController.signal
                    });
                    if (!resp.ok) {
                        const errorText = await getErrorMessage(resp, resp.statusText || 'Unknown error');
                        conv.messages[aiIdx].content = 'Error: ' + errorText;
                        saveConversations();
                        renderChat();
                        return;
                    }
                    if (state.settings.streaming && resp.body) {
                        const reader = resp.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines[lines.length - 1];
                            for (let i = 0; i < lines.length - 1; i++) {
                                const line = lines[i].trim();
                                if (!line || !line.startsWith('data:')) continue;
                                const jsonStr = line.substring(6).trim();
                                if (jsonStr === '[DONE]') break;
                                try {
                                    const chunk = JSON.parse(jsonStr);
                                    const delta = chunk.choices[0]?.delta?.content || '';
                                    if (delta) {
                                        conv.messages[aiIdx].content += delta;
                                        state.tokensGenerated++;
                                    }
                                } catch (e) { }
                            }
                            if (aiBubble) aiBubble.innerHTML = renderMarkdown(conv.messages[aiIdx].content);
                            scrollToBottom();
                        }
                    } else {
                        const data = await resp.json();
                        conv.messages[aiIdx].content = data.choices[0]?.message?.content || 'No response';
                        if (aiBubble) aiBubble.innerHTML = renderMarkdown(conv.messages[aiIdx].content);
                    }
                    conv.updatedAt = Date.now();
                    saveConversations();
                    renderChat();
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        conv.messages[aiIdx].content = 'Error: ' + err.message;
                        saveConversations();
                        renderChat();
                    }
                } finally {
                    state.isGenerating = false;
                    updateSendStopButtons();
                    renderAll();
                    closeSidebarMobile();
                }
            }

            function stopGeneration() { 
                try { state.abortController?.abort(); } catch(e){}
                // ensure state is cleared shortly after abort
                setTimeout(() => {
                    if (state.isGenerating) forceStop();
                }, 250);
            }

            function forceStop() {
                try { state.abortController?.abort(); } catch(e){}
                state.isGenerating = false;
                state.abortController = null;
                state.generationStartTime = 0;
                state.tokensGenerated = 0;
                updateSendStopButtons();
                renderAll();
                showToast('Generation stopped');
            }

            function updateSendStopButtons() {
                document.getElementById('sendBtn').classList.toggle('hidden', state.isGenerating);
                document.getElementById('stopBtn').classList.toggle('hidden', !state.isGenerating);
            }

            async function performWebSearch(query) {
                try {
                    if (!state.settings.apiKey) {
                        return 'Please add your Groq API key in Settings.';
                    }
                    const system = state.settings.systemPrompt || 'You are a helpful research assistant. Answer the user question directly and concisely.';
                    const msgs = [
                        { role: 'system', content: system },
                        { role: 'user', content: `Answer this question directly using your knowledge: ${query}` }
                    ];
                    const body = {
                        model: normalizeModel(state.settings.model || 'openai/gpt-oss-120b'),
                        messages: msgs,
                        temperature: parseFloat(state.settings.temperature),
                        max_tokens: Math.min(2048, parseInt(state.settings.maxTokens) || 1024),
                        top_p: parseFloat(state.settings.topP),
                        stream: false
                    };
                    const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${state.settings.apiKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    });
                    if (!resp.ok) {
                        const errText = await getErrorMessage(resp, resp.statusText || 'Unknown error');
                        return 'Groq search failed: ' + errText;
                    }
                    const data = await resp.json();
                    const text = data.choices?.[0]?.message?.content || data.choices?.[0]?.text || '';
                    return text || 'No answer returned from Groq.';
                } catch (e) {
                    return 'Groq search error: ' + e.message;
                }
            }

            async function searchAndSend() {
                if (state.isGenerating) return;
                const input = document.getElementById('chatInput');
                const q = input.value.trim();
                if (!q) return;
                showToast('Searching web...');
                const summary = await performWebSearch(q);
                const conv = ensureConversation();
                conv.messages.push({ role: 'user', content: q, timestamp: Date.now() });
                conv.messages.push({ role: 'assistant', content: summary, timestamp: Date.now() });
                conv.updatedAt = Date.now();
                saveConversations();
                input.value = '';
                input.style.height = 'auto';
                updateInputStats();
                renderAll();
            }

            function renderMarkdown(text) {
                if (!text) return '';
                let h = escapeHtml(text);
                h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) =>
                    `<pre class="language-${lang}"><code>${code}</code></pre>`
                );
                h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
                h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                h = h.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>');
                h = h.replace(/^## (.+)$/gm, '<h2>$1</h2>');
                h = h.replace(/^# (.+)$/gm, '<h1>$1</h1>');
                h = h.replace(/^>\s?(.+)$/gm, '<blockquote>$1</blockquote>');
                h = h.replace(/^- (.+)$/gm, '<li>$1</li>');
                h = h.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
                h = h.replace(/^\d+\.\s(.+)$/gm, '<li>$1</li>');
                h = h.replace(/((?:<li>.*<\/li>\n?)+)(?!<\/ul>)/g, m => m.includes('<ul>') ? m : '<ol>' + m + '</ol>');
                h = h.replace(/^---$/gm, '<hr>');
                h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
                h = h.replace(/\n\n/g, '</p><p>');
                h = h.replace(/\n/g, '<br>');
                h = '<p>' + h + '</p>';
                h = h.replace(/<p><\/p>/g, '');
                h = h.replace(/<p>(<h[1-4]>)/g, '$1');
                h = h.replace(/(<\/h[1-4]>)<\/p>/g, '$1');
                h = h.replace(/<p>(<ul>)/g, '$1');
                h = h.replace(/(<\/ul>)<\/p>/g, '$1');
                h = h.replace(/<p>(<ol>)/g, '$1');
                h = h.replace(/(<\/ol>)<\/p>/g, '$1');
                h = h.replace(/<p>(<blockquote>)/g, '$1');
                h = h.replace(/(<\/blockquote>)<\/p>/g, '$1');
                h = h.replace(/<p>(<pre>)/g, '$1');
                h = h.replace(/(<\/pre>)<\/p>/g, '$1');
                h = h.replace(/<p>(<hr>)<\/p>/g, '$1');
                return h;
            }

            function escapeHtml(str) {
                const d = document.createElement('div');
                d.textContent = str;
                return d.innerHTML;
            }

            function showToast(msg) {
                document.querySelector('.toast')?.remove();
                const t = document.createElement('div');
                t.className = 'toast';
                t.textContent = msg;
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 2500);
            }

            function openSettings() {
                document.getElementById('settingApiKey').value = state.settings.apiKey;
                document.getElementById('settingModel').value = state.settings.model;
                document.getElementById('settingTemperature').value = state.settings.temperature;
                document.getElementById('tempValue').textContent = state.settings.temperature;
                document.getElementById('settingMaxTokens').value = state.settings.maxTokens;
                document.getElementById('settingTopP').value = state.settings.topP;
                document.getElementById('topPValue').textContent = state.settings.topP;
                document.getElementById('settingSystemPrompt').value = state.settings.systemPrompt;
                document.getElementById('settingStreaming').checked = state.settings.streaming;
                document.getElementById('settingTheme').checked = state.settings.theme === 'light';
                document.getElementById('settingsModal').classList.remove('hidden');
            }

            function closeSettings() {
                document.getElementById('settingsModal').classList.add('hidden');
            }

            function saveSettings() {
                state.settings.apiKey = document.getElementById('settingApiKey').value.trim();
                state.settings.model = normalizeModel(document.getElementById('settingModel').value) || 'openai/gpt-oss-120b';
                state.settings.temperature = parseFloat(document.getElementById('settingTemperature').value);
                state.settings.maxTokens = parseInt(document.getElementById('settingMaxTokens').value);
                state.settings.topP = parseFloat(document.getElementById('settingTopP').value);
                state.settings.systemPrompt = document.getElementById('settingSystemPrompt').value.trim();
                state.settings.streaming = document.getElementById('settingStreaming').checked;
                saveState();
                closeSettings();
                applyTheme();
                showToast('Settings saved!');
            }

            function toggleTheme(light) {
                state.settings.theme = light ? 'light' : 'dark';
                saveState();
                applyTheme();
            }

            function applyTheme() {
                document.body.classList.toggle('light-mode', state.settings.theme === 'light');
            }

            function toggleSidebar() {
                document.getElementById('sidebar').classList.toggle('open');
                document.getElementById('sidebarOverlay').classList.toggle('active');
            }

            function closeSidebarMobile() {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('active');
            }

            function exportChat() {
                const conv = getCurrentConversation();
                if (!conv || !conv.messages.length) {
                    showToast('No messages to export.');
                    return;
                }
                const data = JSON.stringify(conv, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = (conv.title || 'chat') + '.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Chat exported!');
            }

            function importChatTrigger() {
                document.getElementById('importFileInput').click();
            }

            function importChat(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const conv = JSON.parse(e.target.result);
                        if (conv.messages && Array.isArray(conv.messages)) {
                            conv.id = generateId();
                            conv.createdAt = conv.createdAt || Date.now();
                            conv.updatedAt = Date.now();
                            state.conversations.unshift(conv);
                            state.currentConversationId = conv.id;
                            saveConversations();
                            renderAll();
                            showToast('Chat imported!');
                        } else {
                            showToast('Invalid chat file.');
                        }
                    } catch (err) {
                        showToast('Error importing chat.');
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            }

            document.getElementById('sidebarOverlay').addEventListener('click', closeSidebarMobile);
            document.getElementById('settingsModal').addEventListener('click', function(e) {
                if (e.target === this) closeSettings();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeSettings();
            });
            const ma = document.getElementById('mainArea');
            ['dragover', 'dragleave', 'drop'].forEach(ev => ma.addEventListener(ev, function(e) {
                e.preventDefault();
                e.stopPropagation();
            }));
            ma.addEventListener('dragover', () => ma.classList.add('drop-zone-highlight'));
            ma.addEventListener('dragleave', () => ma.classList.remove('drop-zone-highlight'));
            ma.addEventListener('drop', function(e) {
                const files = e.dataTransfer.files;
                if (files.length) {
                    const reader = new FileReader();
                    reader.onload = ev => {
                        try {
                            const conv = JSON.parse(ev.target.result);
                            if (conv.messages && Array.isArray(conv.messages)) {
                                conv.id = generateId();
                                conv.createdAt = conv.createdAt || Date.now();
                                conv.updatedAt = Date.now();
                                state.conversations.unshift(conv);
                                state.currentConversationId = conv.id;
                                saveConversations();
                                renderAll();
                                showToast('Chat imported!');
                            }
                        } catch (err) {
                            showToast('Error importing chat.');
                        }
                    };
                    reader.readAsText(files[0]);
                }
                ma.classList.remove('drop-zone-highlight');
            });
            const chatInput = document.getElementById('chatInput');
            chatInput.addEventListener('keydown', handleInputKeydown);
            chatInput.addEventListener('input', updateInputStats);
            loadState();
            applyTheme();
            renderAll();
            updateSendStopButtons();
            document.getElementById('chatInput').focus();
            window.newChat = newChat;
            window.deleteConversation = deleteConversation;
            window.renamePrompt = renamePrompt;
            window.openSettings = openSettings;
            window.closeSettings = closeSettings;
            window.saveSettings = saveSettings;
            window.toggleTheme = toggleTheme;
            window.toggleSidebar = toggleSidebar;
            window.clearAllConversations = clearAllConversations;
            window.exportChat = exportChat;
            window.importChatTrigger = importChatTrigger;
            window.importChat = importChat;
            window.sendMessage = sendMessage;
            window.stopGeneration = stopGeneration;
            window.handleInputKeydown = handleInputKeydown;
            window.autoResizeTextarea = autoResizeTextarea;
            window.copyMessage = copyMessage;
            window.editMessage = editMessage;
            window.deleteMessage = deleteMessage;
            window.retryResponse = retryResponse;
            window.copyCodeBlock = copyCodeBlock;
            window.searchAndSend = searchAndSend;
        })();
    </script>
</body>
</html>
