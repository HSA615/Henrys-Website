  <script>
    (function() {
      const searchInput = document.getElementById('project-search');
      const stack = document.getElementById('projects-stack');
      if (!searchInput || !stack) return;

      const cards = Array.from(stack.querySelectorAll('.tip-card'));
      let noResults = stack.querySelector('.no-results');
      if (!noResults) {
        noResults = document.createElement('p');
        noResults.className = 'no-results';
        noResults.textContent = 'No projects found matching your search.';
        stack.appendChild(noResults);
      }

      searchInput.addEventListener('input', function() {
        const query = this.value.trim().toLowerCase();
        let visibleCount = 0;

        cards.forEach(function(card) {
          const title = (card.querySelector('.tip-title')?.textContent || '').toLowerCase();
          const body = (card.querySelector('.body-copy')?.textContent || '').toLowerCase();
          const label = (card.querySelector('.tip-label')?.textContent || '').toLowerCase();
          const match = title.includes(query) || body.includes(query) || label.includes(query);

          if (match) {
            card.style.display = '';
            visibleCount++;
          } else {
            card.style.display = 'none';
          }
        });

        noResults.classList.toggle('visible', visibleCount === 0 && query.length > 0);
      });
    })();
  </script>
