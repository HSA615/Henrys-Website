  <text x="145" y="730" fill="#f3bc4e" font-family="Palatino Linotype, serif" font-size="64">What Does RAM Actually Do?</text>
  <text x="145" y="787" fill="#fff4df" font-family="Trebuchet MS, sans-serif" font-size="32">Temporary working memory for active apps, tabs, files, and multitasking.</text>
  <text x="180" y="260" fill="#fff4df" font-family="Trebuchet MS, sans-serif" font-size="30">Fast workspace</text>
  <text x="850" y="260" fill="#fff4df" font-family="Trebuchet MS, sans-serif" font-size="30" text-anchor="end">Not long-term storage</text>
  <text x="210" y="470" fill="#fff4df" font-family="Trebuchet MS, sans-serif" font-size="28">Apps you have open</text>
  <text x="785" y="470" fill="#fff4df" font-family="Trebuchet MS, sans-serif" font-size="28">Data ready right now</text>
