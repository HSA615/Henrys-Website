<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">What does RAM actually do illustration</title>
  <desc id="desc">A stylized memory module with flowing data lines and simple labels about multitasking, speed, and temporary storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d0909"/>
      <stop offset="60%" stop-color="#180c10"/>
